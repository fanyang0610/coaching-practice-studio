name: Publish GitHub Release

on:
  push:
    branches: [main]

concurrency:
  group: studio-release
  queue: max

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the next version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release.py
